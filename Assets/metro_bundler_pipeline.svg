<svg width="100%" viewBox="0 0 760 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Metro bundler pipeline</title>
<desc>Diagram showing Metro's pipeline: resolving the require/import graph from the entry file, transforming each file with Babel (cached by content hash), serializing modules into a bundle, and serving it over HTTP. A side path shows --reset-cache clearing the transform cache.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="220" y="20" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="330" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Resolve</text>
<text x="330" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(24, 95, 165)">walk require/import graph from index.js</text>

<line x1="330" y1="76" x2="330" y2="130" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="130" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="330" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">Transform</text>
<text x="330" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(83, 74, 183)">Babel transpiles each file</text>

<line x1="440" y1="158" x2="478" y2="158" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="480" y="130" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="590" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Transform cache</text>
<text x="590" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">keyed by file content hash</text>

<line x1="330" y1="186" x2="330" y2="240" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="240" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="330" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Serialize</text>
<text x="330" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153, 60, 29)">combine modules into one bundle</text>

<line x1="590" y1="240" x2="590" y2="188" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="480" y="240" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="590" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">--reset-cache</text>
<text x="590" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">clears cache, forces full re-transform</text>

<line x1="330" y1="296" x2="330" y2="350" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="350" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="330" y="368" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">Serve</text>
<text x="330" y="386" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15, 110, 86)">dev server :8081 — index.bundle</text>

</g>
</svg>

<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>iOS autolinking pipeline and its three common failure points</title>
<desc>Diagram showing iOS autolinking: the RN CLI scans node_modules for native dependencies, producing the same react-native config JSON dependency graph used on Android. The Podfile's use_native_modules! call consumes that JSON at pod install time — not automatically on every Xcode build — turning it into pod entries that become real targets inside Pods.xcodeproj. Unlike Android, no generated registration list is needed afterward: classes using RCT_EXPORT_MODULE self-register via Objective-C runtime introspection at launch. The pipeline is where three common failure points originate: Pods falling out of sync with Podfile.lock, signing/provisioning mismatches, and stale DerivedData caches.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="240" y="40" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">node_modules scan</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(95, 94, 90)">has ios/+podspec, or react-native.config.js</text>

<line x1="340" y1="96" x2="340" y2="140" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="140" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">react-native config JSON</text>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">name → { root, platforms.ios } — same JSON as Android</text>

<line x1="340" y1="196" x2="340" y2="240" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="240" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">Podfile's use_native_modules!</text>
<text x="340" y="276" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(83, 74, 183)">runs at pod install time, not every xcodebuild</text>

<line x1="340" y1="296" x2="340" y2="340" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="340" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="340" y="358" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">Pod entries → Pods.xcodeproj</text>
<text x="340" y="376" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">each module becomes a real Pod target</text>

<line x1="340" y1="396" x2="340" y2="440" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="440" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(224, 247, 247)" stroke="rgb(15, 118, 110)"/>
<text x="340" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 84, 78)">ObjC runtime auto-discovery</text>
<text x="340" y="476" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 118, 110)">RCT_EXPORT_MODULE self-registers — no generated list</text>

<line x1="300" y1="496" x2="120" y2="540" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="340" y1="496" x2="340" y2="540" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="380" y1="496" x2="560" y2="540" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="20" y="540" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="120" y="558" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Pods out of sync</text>
<text x="120" y="576" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">forgot pod install after adding a dep</text>

<rect x="240" y="540" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="340" y="558" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Signing/provisioning mismatch</text>
<text x="340" y="576" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">expired cert, missing device UDID</text>

<rect x="460" y="540" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="560" y="558" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Stale DerivedData</text>
<text x="560" y="576" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">cached module/signing state goes stale</text>

</g>
</svg>

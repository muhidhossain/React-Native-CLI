<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>iOS native module calling convention vs. build path</title>
<desc>Diagram showing that the old bridge and JSI take different runtime calling-convention paths into a native module's Objective-C++ code, but both compile through the same CocoaPods/Xcode/Clang pipeline. That pipeline then branches: CocoaPods builds each pod as either a static library (default, merged into one app binary) or a dynamic framework (via use_frameworks!, needed for Swift-heavy pods), before either path links into the final app binary and installs into the JS runtime via a one-time RCTCxxBridge call.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="130" y="40" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="230" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Old bridge</text>
<text x="230" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">RCTBridgeModule, JSON args</text>

<rect x="350" y="40" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="450" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">JSI</text>
<text x="450" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15, 110, 86)">Direct C++ call via HostObject</text>

<line x1="230" y1="96" x2="340" y2="140" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="450" y1="96" x2="340" y2="140" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="140" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">Obj-C++ module</text>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(83, 74, 183)">.mm / .h source</text>

<line x1="340" y1="196" x2="340" y2="240" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="240" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Podspec + Clang</text>
<text x="340" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(24, 95, 165)">Built as a Pods.xcodeproj target</text>

<line x1="300" y1="296" x2="230" y2="340" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="380" y1="296" x2="450" y2="340" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="130" y="340" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="230" y="358" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Static library</text>
<text x="230" y="376" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153, 60, 29)">Default — merged into one binary</text>

<rect x="350" y="340" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(224, 247, 247)" stroke="rgb(15, 118, 110)"/>
<text x="450" y="358" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 84, 78)">Dynamic framework</text>
<text x="450" y="376" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15, 118, 110)">via use_frameworks! — own embedded binary</text>

<line x1="230" y1="396" x2="340" y2="440" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="450" y1="396" x2="340" y2="440" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="440" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="340" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Linked via xcodebuild</text>
<text x="340" y="476" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">Into the signed .app / .ipa</text>

<line x1="340" y1="496" x2="230" y2="540" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="140" y="540" width="180" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="230" y="558" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">RCTCxxBridge install</text>
<text x="230" y="576" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">One-time, at runtime startup</text>

<line x1="320" y1="568" x2="358" y2="568" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="360" y="540" width="180" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="450" y="558" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Registers module</text>
<text x="450" y="576" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">HostObject or RCTBridgeModule</text>

</g>
</svg>

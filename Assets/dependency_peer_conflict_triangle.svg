<svg width="100%" viewBox="0 0 640 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Peer dependency triangle</title>
<desc>Diagram showing React, React Native, and third-party native libraries each holding peer dependency ranges on one another, and highlighting that the React Native to third-party-lib edge carries native API compatibility risk that plain semver peer ranges don't capture.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<line x1="320" y1="90" x2="150" y2="230" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="320" y1="90" x2="490" y2="230" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="150" y1="248" x2="490" y2="248" stroke="rgb(153, 60, 29)" stroke-width="2"/>

<text x="180" y="150" text-anchor="middle" font-size="12" fill="rgb(95, 94, 90)">peer range</text>
<text x="180" y="166" text-anchor="middle" font-size="12" fill="rgb(95, 94, 90)">(semver)</text>

<text x="460" y="150" text-anchor="middle" font-size="12" fill="rgb(95, 94, 90)">peer range</text>
<text x="460" y="166" text-anchor="middle" font-size="12" fill="rgb(95, 94, 90)">(semver)</text>

<text x="320" y="278" text-anchor="middle" font-size="12" font-weight="500" fill="rgb(153, 60, 29)">native API surface</text>
<text x="320" y="294" text-anchor="middle" font-size="12" font-weight="500" fill="rgb(153, 60, 29)">not captured by semver</text>

<rect x="220" y="20" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="320" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">React</text>
<text x="320" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(24, 95, 165)">JS runtime + hooks</text>

<rect x="20" y="220" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="130" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">React Native</text>
<text x="130" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(83, 74, 183)">internal native APIs</text>

<rect x="400" y="220" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="510" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Third-party native libs</text>
<text x="510" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153, 60, 29)">reanimated, screens, etc.</text>

</g>
</svg>

<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Build-time vs runtime debugging flow on Android</title>
<desc>Diagram showing two parallel failure domains: the build-time chain from gradlew assemble through Gradle/CMake/NDK to a build-time error, and the runtime chain from an installed APK/AAB through a running app to adb logcat output. Both chains converge into a diagnosis step that matches a runtime symptom in logcat to its build-time root cause, for example an UnsatisfiedLinkError caused by an ABI filter mismatch.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<text x="170" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="rgb(95, 94, 90)">BUILD TIME</text>
<text x="510" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="rgb(95, 94, 90)">RUNTIME</text>

<rect x="40" y="40" width="260" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="170" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">./gradlew assemble*</text>
<text x="170" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">Kicks off the Gradle build</text>

<rect x="380" y="40" width="260" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="510" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">APK/AAB installed</text>
<text x="510" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">adb install / run-android</text>

<line x1="170" y1="96" x2="170" y2="140" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="510" y1="96" x2="510" y2="140" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="40" y="140" width="260" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="170" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Gradle → CMake → NDK</text>
<text x="170" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(24, 95, 165)">Compiles per ABI, links native code</text>

<rect x="380" y="140" width="260" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="510" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">App running on device</text>
<text x="510" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15, 110, 86)">JS and native code executing</text>

<line x1="170" y1="196" x2="170" y2="240" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="510" y1="196" x2="510" y2="240" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="40" y="240" width="260" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="170" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Build-time error</text>
<text x="170" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153, 60, 29)">manifest merge, R8, duplicate class, CMake config</text>

<rect x="380" y="240" width="260" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="510" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">adb logcat</text>
<text x="510" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153, 60, 29)">AndroidRuntime, ReactNativeJS, native tombstone</text>

<line x1="220" y1="296" x2="290" y2="356" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="460" y1="296" x2="390" y2="356" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="140" y="358" width="400" height="72" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="340" y="380" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">Diagnosis</text>
<text x="340" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(83, 74, 183)">Match the runtime symptom in logcat to its build-time cause</text>
<text x="340" y="416" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(83, 74, 183)">e.g. UnsatisfiedLinkError ← ABI filter mismatch</text>

</g>
</svg>

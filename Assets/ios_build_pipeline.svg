<svg width="100%" viewBox="0 0 700 660" role="img" xmlns="http://www.w3.org/2000/svg">
<title>iOS build pipeline</title>
<desc>Diagram showing how a Podfile is resolved by pod install into a generated Pods.xcodeproj, which combines with the app's own .xcodeproj into a .xcworkspace. That workspace, together with a signing certificate and provisioning profile, feeds xcodebuild, which compiles with Clang/Swift and signs the app into a .app or .ipa, which is then installed onto a simulator or device.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="40" y="40" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="140" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Podfile</text>
<text x="140" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Declares native dependencies</text>

<line x1="140" y1="96" x2="140" y2="150" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="40" y="150" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="140" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Pods.xcodeproj</text>
<text x="140" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Generated by pod install</text>

<rect x="460" y="40" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="560" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">YourApp.xcodeproj</text>
<text x="560" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Your app's own Xcode project</text>

<line x1="140" y1="206" x2="250" y2="260" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="560" y1="96" x2="450" y2="260" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="250" y="260" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="350" y="278" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">.xcworkspace</text>
<text x="350" y="296" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">Glues app + Pods projects</text>

<rect x="460" y="150" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="560" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Signing &amp; provisioning</text>
<text x="560" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Cert + profile, Apple Developer acct</text>

<line x1="350" y1="316" x2="350" y2="370" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="560" y1="206" x2="450" y2="370" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="250" y="370" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="350" y="388" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">xcodebuild</text>
<text x="350" y="406" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(83, 74, 183)">Compiles (Clang/Swift) &amp; signs</text>

<line x1="350" y1="426" x2="350" y2="470" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="250" y="470" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="350" y="488" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">.app / .ipa</text>
<text x="350" y="506" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">Signed build artifact</text>

<line x1="350" y1="526" x2="240" y2="570" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="140" y="570" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="240" y="588" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Install</text>
<text x="240" y="606" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(95, 94, 90)">simctl, or device install via Xcode</text>

<line x1="340" y1="598" x2="378" y2="598" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="380" y="570" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="480" y="588" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Simulator / Device</text>
<text x="480" y="606" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(95, 94, 90)">Runs app; shows console logs</text>

</g>
</svg>

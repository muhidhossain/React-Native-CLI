<svg width="100%" viewBox="0 0 680 536" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Native module calling convention vs. build path</title>
<desc>Diagram showing that the old bridge and JSI take different runtime calling-convention paths into a native module's C++ code, but both compile through the same CMake/NDK per-ABI build, producing one .so per architecture, installed into the JS runtime via a one-time JNI call.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="130" y="40" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="230" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Old bridge</text>
<text x="230" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">JSON serialize + JNI marshal</text>

<rect x="350" y="40" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="450" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">JSI</text>
<text x="450" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15, 110, 86)">Direct C++ call via HostObject</text>

<line x1="230" y1="96" x2="340" y2="140" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="450" y1="96" x2="340" y2="140" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="140" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">C++ module</text>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(83, 74, 183)">.cpp / .h source</text>

<line x1="340" y1="196" x2="340" y2="240" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="240" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">CMake + NDK</text>
<text x="340" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(24, 95, 165)">Compiles per ABI</text>

<line x1="340" y1="296" x2="340" y2="340" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="340" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="340" y="358" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Compiled .so</text>
<text x="340" y="376" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153, 60, 29)">arm64-v8a, armeabi-v7a, x86, x86_64</text>

<line x1="340" y1="396" x2="230" y2="440" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="140" y="440" width="180" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="230" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">JNI install call</text>
<text x="230" y="476" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">One-time, at library load</text>

<line x1="320" y1="468" x2="358" y2="468" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="360" y="440" width="180" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="450" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Java/Kotlin class</text>
<text x="450" y="476" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">Registers the native module</text>

</g>
</svg>

<svg width="100%" viewBox="0 0 680 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Deep link resolution pipeline from URL tap to reconstructed navigation state tree</title>
<desc>Diagram showing a tapped https://myapp.com/profile/42/settings link split into per-platform ownership verification — Android checking assetlinks.json via an autoVerify intent filter, iOS checking apple-app-site-association via Associated Domains — merging once the app opens, splitting again into cold-start (Linking.getInitialURL) versus warm-start (Linking.addEventListener) handling, merging into React Navigation's linking.config path matching, and finally producing the reconstructed nested navigation state tree: a Profile screen with a userId param containing a nested Settings screen.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="140" y="40" width="400" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">URL tapped</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(95, 94, 90)">https://myapp.com/profile/42/settings</text>

<line x1="340" y1="96" x2="230" y2="140" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="340" y1="96" x2="450" y2="140" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="130" y="140" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="230" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Android verifies</text>
<text x="230" y="176" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">.well-known/assetlinks.json</text>

<rect x="350" y="140" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="450" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">iOS verifies</text>
<text x="450" y="176" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">.well-known/apple-app-site-association</text>

<line x1="230" y1="196" x2="340" y2="240" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="450" y1="196" x2="340" y2="240" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="240" y="240" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">App opens</text>
<text x="340" y="276" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(83, 74, 183)">falls back to browser if verification failed</text>

<line x1="340" y1="296" x2="230" y2="340" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="340" y1="296" x2="450" y2="340" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="130" y="340" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="230" y="358" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">Cold start</text>
<text x="230" y="376" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">Linking.getInitialURL()</text>

<rect x="350" y="340" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="450" y="358" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">Warm start</text>
<text x="450" y="376" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">Linking.addEventListener('url')</text>

<line x1="230" y1="396" x2="340" y2="440" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="450" y1="396" x2="340" y2="440" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="440" width="240" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="340" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">linking.config path matching</text>
<text x="340" y="476" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(83, 74, 183)">React Navigation walks config.screens top-down</text>

<line x1="340" y1="496" x2="340" y2="540" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="170" y="540" width="340" height="66" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="340" y="562" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Nested navigation state tree reconstructed</text>
<text x="340" y="580" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Profile { userId: '42' } → nested Settings screen</text>
<text x="340" y="596" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">whole path reconstructed top-down, not just the leaf screen</text>

</g>
</svg>

<svg width="100%" viewBox="0 0 700 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Bridge vs JSI call path compared</title>
<desc>Side-by-side comparison of how a JS-to-native call travels under the old architecture versus the new one. On the left, the old Bridge: a JS thread box, then an async bridge queue box where arguments are serialized to JSON, batched, sent asynchronously, and deserialized on the other side, then a native/UI thread box. On the right, JSI: a JS thread box, then a direct synchronous C++ call box with no serialization and the caller's choice of sync or async, then a native/UI thread box. Below both columns, a box notes that high-frequency calls such as animations, sensors, or per-keystroke calls pay this cost every time while one-off calls barely notice either way. A final caveat box notes that JSI's synchronous calls block the calling thread and that multi-thread JSI access shifts thread-safety responsibility onto native module code.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<text x="185" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="rgb(95, 94, 90)">OLD ARCHITECTURE — BRIDGE</text>
<text x="515" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="rgb(95, 94, 90)">NEW ARCHITECTURE — JSI</text>

<rect x="40" y="36" width="290" height="44" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="185" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">JS THREAD</text>

<rect x="370" y="36" width="290" height="44" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="515" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">JS THREAD</text>

<line x1="185" y1="80" x2="185" y2="96" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="515" y1="80" x2="515" y2="96" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="40" y="98" width="290" height="92" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="185" y="118" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(113, 43, 19)">Bridge queue (async)</text>
<text x="185" y="138" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">serialize args → JSON</text>
<text x="185" y="156" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">queued, batched, sent async</text>
<text x="185" y="174" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">deserialize on the other side</text>

<rect x="370" y="98" width="290" height="92" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="515" y="118" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(8, 80, 65)">Direct C++ call (JSI)</text>
<text x="515" y="138" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">no serialization, no queue</text>
<text x="515" y="156" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">synchronous — waits for return</text>
<text x="515" y="174" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">sync or async, caller's choice</text>

<line x1="185" y1="190" x2="185" y2="206" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="515" y1="190" x2="515" y2="206" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="40" y="208" width="290" height="44" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="185" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">NATIVE / UI THREAD</text>

<rect x="370" y="208" width="290" height="44" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="515" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">NATIVE / UI THREAD</text>

<line x1="185" y1="252" x2="330" y2="270" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="515" y1="252" x2="370" y2="270" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="40" y="272" width="620" height="64" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="350" y="292" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(12, 68, 124)">Where the overhead actually shows up</text>
<text x="350" y="310" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">High-frequency calls — animations, sensors, every keystroke — pay this cost every time.</text>
<text x="350" y="326" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">One-off calls (an API read, opening a modal) barely notice either way.</text>

<line x1="350" y1="336" x2="350" y2="352" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="40" y="354" width="620" height="64" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="350" y="374" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(113, 43, 19)">Caveat — the JSI trade-off</text>
<text x="350" y="392" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">Synchronous calls block the calling thread — a slow native method can itself cause jank.</text>
<text x="350" y="408" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">Multi-thread JSI access shifts thread-safety responsibility onto native module code.</text>

</g>
</svg>

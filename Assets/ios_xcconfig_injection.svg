<svg width="100%" viewBox="0 0 700 540" role="img" xmlns="http://www.w3.org/2000/svg">
<title>How pod install wires CocoaPods into the app target's build</title>
<desc>Diagram showing that pod install generates Pods.xcodeproj from the Podfile, then both writes Pods-App debug and release xcconfig files that get included into the app target's build settings, and adds CP-prefixed build phases (check manifest lock, embed pods frameworks, copy pods resources) to the app target. Both of these make the app target pod-aware, and that target together with Pods.xcodeproj are bundled into the .xcworkspace.</desc>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="250" y="30" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="350" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Podfile</text>
<text x="350" y="66" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Declares native dependencies</text>

<line x1="350" y1="86" x2="350" y2="130" marker-end="url(#arrow2)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<text x="365" y="110" font-size="10.5" fill="rgb(95, 94, 90)">pod install</text>

<rect x="250" y="130" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="350" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Pods.xcodeproj</text>
<text x="350" y="166" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">One generated target per pod</text>

<line x1="290" y1="186" x2="150" y2="235" marker-end="url(#arrow2)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="410" y1="186" x2="530" y2="235" marker-end="url(#arrow2)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="30" y="235" width="240" height="70" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="150" y="255" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="500" fill="rgb(8, 80, 65)">Pods-App.{debug,release}.xcconfig</text>
<text x="150" y="273" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">Header/framework search paths,</text>
<text x="150" y="289" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">OTHER_LDFLAGS — included into app config</text>

<rect x="410" y="228" width="260" height="90" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="540" y="248" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="500" fill="rgb(60, 52, 137)">[CP] build phases added</text>
<text x="540" y="267" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(83, 74, 183)">Check Pods Manifest.lock</text>
<text x="540" y="284" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(83, 74, 183)">Embed Pods Frameworks</text>
<text x="540" y="301" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(83, 74, 183)">Copy Pods Resources</text>

<line x1="150" y1="305" x2="270" y2="360" marker-end="url(#arrow2)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="540" y1="318" x2="430" y2="360" marker-end="url(#arrow2)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="210" y="360" width="280" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="350" y="378" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">App.xcodeproj (now pod-aware)</text>
<text x="350" y="396" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Your original app target, config-patched</text>

<line x1="350" y1="416" x2="350" y2="460" marker-end="url(#arrow2)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="210" y="460" width="280" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="350" y="478" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">.xcworkspace</text>
<text x="350" y="496" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">Bundles App.xcodeproj + Pods.xcodeproj</text>

</g>
</svg>

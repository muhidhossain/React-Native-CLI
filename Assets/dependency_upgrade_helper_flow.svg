<svg width="100%" viewBox="0 0 640 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Upgrade Helper workflow</title>
<desc>Diagram showing that upgrading React Native is not a simple package bump: the current version and target version feed into the Upgrade Helper, which produces a template diff of changed native files, which you apply by hand, adapting or skipping hunks that touch files you've already customized, resulting in native projects on the target version.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="20" y="20" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="120" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Current RN version</text>
<text x="120" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">e.g. 0.72</text>

<rect x="420" y="20" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="520" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Target RN version</text>
<text x="520" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">e.g. 0.74</text>

<line x1="150" y1="76" x2="270" y2="130" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="490" y1="76" x2="370" y2="130" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="130" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="320" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Upgrade Helper</text>
<text x="320" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(24, 95, 165)">Diffs the RN template</text>

<line x1="320" y1="186" x2="320" y2="230" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="230" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="320" y="248" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">Template diff</text>
<text x="320" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(83, 74, 183)">android/ + ios/ changed files</text>

<line x1="320" y1="286" x2="320" y2="330" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="330" width="200" height="66" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="320" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Apply by hand</text>
<text x="320" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153, 60, 29)">skip/adapt hunks touching</text>
<text x="320" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153, 60, 29)">files you've customized</text>

<line x1="320" y1="396" x2="320" y2="424" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="424" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="320" y="442" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">Native projects updated</text>
<text x="320" y="460" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15, 110, 86)">android/, ios/ on target version</text>

</g>
</svg>

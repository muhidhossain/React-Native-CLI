<svg width="100%" viewBox="0 0 700 550" role="img" xmlns="http://www.w3.org/2000/svg">
<title>CI/CD release pipeline</title>
<desc>Diagram showing a push or tag triggering a CI runner (GitHub Actions, Bitrise, or CircleCI), which needs a macOS runner specifically for iOS since Xcode can't run on Linux. The CI runner injects secrets like the keystore, provisioning profile, and API keys, then invokes a Fastlane lane that builds, signs, and uploads the app to the Play Console or App Store Connect.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="220" y="20" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="330" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Push / tag</text>
<text x="330" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95, 94, 90)">triggers the pipeline</text>

<line x1="330" y1="76" x2="330" y2="130" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="130" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="330" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">CI runner</text>
<text x="330" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(24, 95, 165)">GitHub Actions / Bitrise / CircleCI</text>

<line x1="440" y1="158" x2="478" y2="158" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="480" y="130" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="580" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">iOS needs macOS</text>
<text x="580" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153, 60, 29)">Xcode can't run on Linux</text>

<line x1="330" y1="186" x2="330" y2="240" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="240" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="330" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">Inject secrets</text>
<text x="330" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(83, 74, 183)">keystore, provisioning profile, API keys</text>

<line x1="330" y1="296" x2="330" y2="350" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="350" width="220" height="66" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="330" y="370" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Fastlane lane</text>
<text x="330" y="388" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153, 60, 29)">build → sign → upload</text>

<line x1="330" y1="416" x2="330" y2="466" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="220" y="466" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="330" y="484" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">Play Console /</text>
<text x="330" y="502" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15, 110, 86)">App Store Connect</text>

</g>
</svg>

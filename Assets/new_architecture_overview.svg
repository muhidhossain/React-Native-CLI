<svg width="100%" viewBox="0 0 700 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>How Fabric, TurboModules, and Codegen fit together on JSI</title>
<desc>Diagram showing that a spec file written in TypeScript or Flow, describing a TurboModule or Fabric component's shape, is fed into Codegen, which generates typed C++ interface headers. Those headers feed both Fabric, the renderer built on a shared C++ Shadow Tree, and TurboModules, the native module system, both of which sit on JSI, the shared C++ substrate providing direct synchronous calls with no serialization and no message queue. A side note states that the old Bridge, with its JSON serialization and async queue, is no longer in the picture.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="225" y="20" width="250" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="350" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">Spec file (TS / Flow)</text>
<text x="350" y="56" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(83, 74, 183)">Describes a TurboModule or Fabric component's shape</text>

<line x1="350" y1="76" x2="350" y2="94" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="200" y="96" width="300" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="350" y="114" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Codegen</text>
<text x="350" y="132" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Generates typed C++ interface headers from the spec</text>

<line x1="350" y1="152" x2="225" y2="170" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="350" y1="152" x2="475" y2="170" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="110" y="172" width="230" height="64" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="225" y="194" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">Fabric</text>
<text x="225" y="212" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">Renders via a shared C++ Shadow Tree</text>

<rect x="360" y="172" width="230" height="64" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="475" y="194" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">TurboModules</text>
<text x="475" y="212" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">Native modules, lazy-loaded, called via JSI</text>

<line x1="250" y1="236" x2="300" y2="256" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="450" y1="236" x2="400" y2="256" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="40" y="258" width="620" height="64" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="350" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">JSI — shared C++ substrate</text>
<text x="350" y="298" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(95, 94, 90)">Direct synchronous calls — no serialization, no message queue</text>

<line x1="350" y1="322" x2="350" y2="338" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="140" y="340" width="420" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)" stroke-dasharray="4 3"/>
<text x="350" y="358" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(113, 43, 19)">Old Bridge — no longer in the picture</text>
<text x="350" y="376" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">JSON serialization + async queue, removed entirely</text>

</g>
</svg>

<svg width="100%" viewBox="0 0 700 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The persisted-state rehydration flash</title>
<desc>Sequence diagram down the page: app cold start, then Render #1 where the store still has default state because persisted data hasn't loaded yet, then storage read completes asynchronously, then Render #2 where the store has the rehydrated state. A side callout brackets Render #1 through the storage read completing, labeled the flash window, noting the user briefly sees default state before rehydration. A bottom callout gives the fix: gate initial render until rehydration finishes, via redux-persist's PersistGate or a manual hasHydrated check in Zustand.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="140" y="20" width="320" height="48" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="300" y="44" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">App cold start</text>

<line x1="300" y1="68" x2="300" y2="86" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="140" y="88" width="320" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="300" y="108" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(113, 43, 19)">Render #1 — store has DEFAULT state</text>
<text x="300" y="126" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">persisted data hasn't loaded yet</text>

<line x1="300" y1="144" x2="300" y2="162" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="140" y="164" width="320" height="48" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="300" y="188" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(68, 68, 65)">Storage read completes (async)</text>

<line x1="300" y1="212" x2="300" y2="230" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="140" y="232" width="320" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="300" y="252" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(8, 80, 65)">Render #2 — store has REHYDRATED state</text>
<text x="300" y="270" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">now matches what was persisted</text>

<line x1="460" y1="116" x2="500" y2="150" stroke="rgb(153, 60, 29)" stroke-width="1.5" stroke-dasharray="3 3"/>

<rect x="500" y="88" width="180" height="124" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)" stroke-dasharray="4 3"/>
<text x="590" y="112" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(113, 43, 19)">FLASH WINDOW</text>
<text x="590" y="140" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">User briefly sees</text>
<text x="590" y="156" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">default state before</text>
<text x="590" y="172" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">rehydration finishes</text>

<line x1="300" y1="288" x2="300" y2="306" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="80" y="308" width="440" height="72" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="300" y="328" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(12, 68, 124)">Fix</text>
<text x="300" y="348" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Gate initial render until rehydration finishes —</text>
<text x="300" y="364" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">PersistGate (redux-persist) or a manual hasHydrated check (Zustand).</text>

</g>
</svg>

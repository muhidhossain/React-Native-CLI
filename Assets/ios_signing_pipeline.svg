<svg width="100%" viewBox="0 0 700 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>iOS signing and release pipeline</title>
<desc>Diagram showing how a Certificate, App ID, and (for development builds) a registered device list combine into a Provisioning Profile. That profile feeds an Xcode Archive (.xcarchive, which bundles the release build with its .dSYM), which is then exported into a destination-specific signed .ipa. The .ipa is uploaded to App Store Connect, from which it reaches testers via TestFlight or the public via App Store review.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<rect x="20" y="40" width="180" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="110" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Certificate</text>
<text x="110" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Dev or Distribution, in Keychain</text>

<rect x="260" y="40" width="180" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="350" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">App ID</text>
<text x="350" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Bundle identifier + capabilities</text>

<rect x="500" y="40" width="180" height="56" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="590" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(12, 68, 124)">Registered devices</text>
<text x="590" y="76" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Development builds only</text>

<line x1="110" y1="96" x2="300" y2="150" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="350" y1="96" x2="350" y2="150" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="590" y1="96" x2="400" y2="150" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="250" y="150" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="350" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8, 80, 65)">Provisioning Profile</text>
<text x="350" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">Ties cert + App ID (+ devices) together</text>

<line x1="350" y1="206" x2="350" y2="260" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="250" y="260" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="350" y="278" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60, 52, 137)">.xcarchive</text>
<text x="350" y="296" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(83, 74, 183)">Product → Archive; bundles .dSYM</text>

<line x1="350" y1="316" x2="350" y2="370" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="250" y="370" width="200" height="56" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="350" y="388" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113, 43, 19)">Export .ipa</text>
<text x="350" y="406" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">Re-signs for App Store / Ad Hoc / Enterprise</text>

<line x1="350" y1="426" x2="240" y2="480" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="140" y="480" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="250" y="498" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">Upload to App Store Connect</text>
<text x="250" y="516" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(95, 94, 90)">via Xcode Organizer or notarytool</text>

<line x1="360" y1="508" x2="398" y2="508" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="400" y="480" width="220" height="56" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="510" y="498" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68, 68, 65)">TestFlight / App Store</text>
<text x="510" y="516" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(95, 94, 90)">Distributed to testers or public</text>

</g>
</svg>

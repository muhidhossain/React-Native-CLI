<svg width="100%" viewBox="0 0 700 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Push delivery goes through the platform's own service, not a library</title>
<desc>Two rows show that push notifications are delivered through the OS vendor's own infrastructure. On Android, your backend, signed with Firebase credentials, sends to FCM, which delivers via Google Play Services to the device. On iOS, your backend, signed with an APNs auth key or certificate, sends to APNs, which delivers via Apple's own push infrastructure to the device. A callout below states that your backend needs a device token before sending anything, and obtaining and refreshing that token is where the native setup lives.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<text x="350" y="16" text-anchor="middle" font-size="12" font-weight="600" fill="rgb(95, 94, 90)">PUSH DELIVERY — PLATFORM SERVICE, NOT A LIBRARY</text>

<rect x="20" y="30" width="170" height="64" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="105" y="52" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(68, 68, 65)">Your backend</text>
<text x="105" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(95, 94, 90)">signed with Firebase creds</text>

<line x1="190" y1="62" x2="268" y2="62" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="270" y="30" width="170" height="64" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="355" y="52" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(12, 68, 124)">FCM</text>
<text x="355" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(24, 95, 165)">Google Play Services</text>

<line x1="440" y1="62" x2="518" y2="62" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="520" y="30" width="160" height="64" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="600" y="52" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(68, 68, 65)">Device</text>
<text x="600" y="72" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(95, 94, 90)">Android</text>

<rect x="20" y="150" width="170" height="64" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="105" y="172" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(68, 68, 65)">Your backend</text>
<text x="105" y="192" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(95, 94, 90)">signed with APNs key/cert</text>

<line x1="190" y1="182" x2="268" y2="182" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="270" y="150" width="170" height="64" rx="8" stroke-width="0.5" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)"/>
<text x="355" y="172" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(60, 52, 137)">APNs</text>
<text x="355" y="192" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(83, 74, 183)">Apple's push infrastructure</text>

<line x1="440" y1="182" x2="518" y2="182" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="520" y="150" width="160" height="64" rx="8" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="600" y="172" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(68, 68, 65)">Device</text>
<text x="600" y="192" text-anchor="middle" dominant-baseline="central" font-size="10" fill="rgb(95, 94, 90)">iOS</text>

<line x1="350" y1="214" x2="350" y2="230" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="40" y="232" width="620" height="72" rx="8" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="350" y="254" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(12, 68, 124)">Your backend needs a device token before sending anything</text>
<text x="350" y="274" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">Obtaining and refreshing that token is where the native setup lives.</text>

</g>
</svg>

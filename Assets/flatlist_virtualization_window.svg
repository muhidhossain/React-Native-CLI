<svg width="100%" viewBox="0 0 700 260" role="img" xmlns="http://www.w3.org/2000/svg">
<title>FlatList virtualization window</title>
<desc>Diagram of how FlatList virtualizes a long list: a row of five segments from left to right — unmounted/recycled items, rendered off-screen items above the viewport, the visible viewport, rendered off-screen items below the viewport, and unmounted/recycled items again. A bracket above the middle three segments labels the windowSize span, the number of screens kept rendered around the viewport. A note box below states that every scroll recycles items, mounting and unmounting hundreds of times, so a leak-shaped bug in one list item, such as a missed subscription cleanup, compounds instead of firing once.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="rgb(137, 135, 129)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g font-family="anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">

<text x="350" y="16" text-anchor="middle" font-size="12" font-weight="600" fill="rgb(95, 94, 90)">FlatList VIRTUALIZATION WINDOW</text>

<text x="350" y="38" text-anchor="middle" font-size="11" fill="rgb(95, 94, 90)">windowSize span — default: 10 screens above + visible + 10 below</text>

<line x1="140" y1="55" x2="560" y2="55" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="140" y1="50" x2="140" y2="60" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="560" y1="50" x2="560" y2="60" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>
<line x1="140" y1="55" x2="140" y2="70" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1"/>
<line x1="560" y1="55" x2="560" y2="70" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1"/>

<rect x="40" y="70" width="100" height="70" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="90" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="rgb(68, 68, 65)">Unmounted</text>
<text x="90" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(68, 68, 65)">(recycled)</text>

<rect x="140" y="70" width="140" height="70" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="210" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="rgb(12, 68, 124)">Rendered</text>
<text x="210" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">off-screen, above</text>

<rect x="280" y="70" width="140" height="70" stroke-width="0.5" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)"/>
<text x="350" y="98" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="rgb(8, 80, 65)">VISIBLE</text>
<text x="350" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(15, 110, 86)">viewport</text>

<rect x="420" y="70" width="140" height="70" stroke-width="0.5" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)"/>
<text x="490" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="rgb(12, 68, 124)">Rendered</text>
<text x="490" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24, 95, 165)">off-screen, below</text>

<rect x="560" y="70" width="100" height="70" stroke-width="0.5" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)"/>
<text x="610" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="rgb(68, 68, 65)">Unmounted</text>
<text x="610" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(68, 68, 65)">(recycled)</text>

<line x1="350" y1="140" x2="350" y2="158" marker-end="url(#arrow)" stroke="rgb(137, 135, 129)" stroke-width="1.5"/>

<rect x="40" y="160" width="620" height="80" rx="8" stroke-width="0.5" fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)"/>
<text x="350" y="182" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(113, 43, 19)">Virtualization amplifies sloppy cleanup</text>
<text x="350" y="202" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">Every scroll recycles items — mount/unmount happens hundreds of times.</text>
<text x="350" y="218" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(153, 60, 29)">A leak-shaped bug in one item (missed subscription cleanup) compounds instead of firing once.</text>

</g>
</svg>
